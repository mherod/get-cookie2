[package]
name = "get-cookie2"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha2 = "0.10"
dirs = "5.0"
glob = "0.3"
jsonwebtoken = "9.3"
base64 = "0.22"
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"
